name: Public homepage and multiplayer arcade
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/backend
      - run: python -m unittest discover -s tests -p test_rally_rooms.py -v
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/backend
      - run: npm ci
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/frontend
      - run: npm run build
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
          VITE_CLERK_PUBLISHABLE_KEY: ''
      - run: npm install --prefix .ui-test --no-package-lock playwright@1.64.1
      - run: ./.ui-test/node_modules/.bin/playwright install --with-deps chromium
      - run: node tools/test_public_arcade.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-arcade-views
          path: test-output/public-arcade
          if-no-files-found: ignore
          retention-days: 3
