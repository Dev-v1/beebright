name: Standalone racing executable
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: node tools/export-racing.mjs racing-beta/export
      - run: npm ci
        working-directory: racing-beta/export
      - run: npm test
        working-directory: racing-beta/export
      - run: npm run build
        working-directory: racing-beta/export
      - run: python -m pip install pywebview==6.2.1 pythonnet==3.2.0 pyinstaller==6.22.3
      - run: python -m PyInstaller --noconfirm --onefile --hide-console hide-early --name Beta-Car-Racing-Game --collect-all webview --collect-all clr_loader --add-data "dist;dist" launcher.py
        working-directory: racing-beta/export
      - name: Install official WebView2 if missing
        shell: pwsh
        run: |
          $Found = (Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue)
          if (-not $Found) {
            $Setup = Join-Path $env:RUNNER_TEMP 'webview2-setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $Setup
            $Signature = Get-AuthenticodeSignature $Setup
            if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft installer signature' }
            $Process = Start-Process $Setup -ArgumentList '/silent','/install' -Wait -PassThru
            if ($Process.ExitCode -notin @(0,3010)) { throw 'WebView2 installation failed' }
          }
      - name: Launch the actual frozen Windows executable
        shell: pwsh
        env:
          RACING_TEST_OUTPUT: ${{ runner.temp }}/racing-beta-views
        run: |
          & ./racing-beta/export/dist/Beta-Car-Racing-Game.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Standalone executable test failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Racing-beta-executable-and-views
          path: |
            racing-beta/export/dist/Beta-Car-Racing-Game.exe
            ${{ runner.temp }}/racing-beta-views/*.png
          if-no-files-found: error
          retention-days: 14
