name: Dependency security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/backend
  javascript-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/frontend
      - run: npm audit --audit-level=high
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/frontend
