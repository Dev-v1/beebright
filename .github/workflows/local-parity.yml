name: Desktop parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/frontend
      - run: node tools/build-local.mjs --materialize
      - run: python3 -m unittest discover -s local -v
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci
        working-directory: BeeBright-Full-Stack/beebright-spelling-bee/frontend
      - run: node tools/build-local.mjs --materialize
      - run: python -m unittest discover -s local -v
      - run: ./tools/test-local-install.ps1
        shell: powershell
      - run: ./tools/test-local-update.ps1
        shell: powershell
